[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#f9f9f7"
secondaryBackgroundColor = "#f0efec"
textColor = "#0b0b0b"
borderColor = "#e1e0d9"
font = "system-ui, -apple-system, 'Segoe UI', sans-serif"
baseRadius = "8px"
headingFontSizes = ["2rem", "1.4rem", "1.2rem"]
headingFontWeights = [650, 600, 600]
paddingTop = "2rem"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
